<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <title>论文查重程序流程图</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1f2937">论文查重程序主流程</text>
  <g font-family="Arial, sans-serif" font-size="15" text-anchor="middle">
    <rect x="300" y="55" width="300" height="52" rx="26" fill="#dbeafe" stroke="#2563eb"/>
    <text x="450" y="87" fill="#1e3a8a">读取 3 个命令行参数</text>
    <line x1="450" y1="107" x2="450" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <polygon points="450,135 600,185 450,235 300,185" fill="#fef3c7" stroke="#d97706"/>
    <text x="450" y="181" fill="#78350f">参数数量和内容正确？</text>
    <text x="450" y="202" font-size="12" fill="#92400e">否 → 退出码 2</text>
    <line x1="450" y1="235" x2="450" y2="263" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="300" y="263" width="300" height="52" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="450" y="295" fill="#14532d">读取 UTF-8 原文和抄袭版</text>
    <line x1="450" y1="315" x2="450" y2="343" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="300" y="343" width="300" height="52" rx="10" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="450" y="375" fill="#312e81">去空白 → 生成 3-gram 词频</text>
    <line x1="450" y1="395" x2="450" y2="423" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="300" y="423" width="300" height="52" rx="10" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="450" y="455" fill="#312e81">计算余弦相似度并格式化</text>
    <line x1="450" y1="475" x2="450" y2="503" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="300" y="503" width="300" height="40" rx="20" fill="#dbeafe" stroke="#2563eb"/>
    <text x="450" y="528" fill="#1e3a8a">写入答案文件</text>
    <line x1="300" y1="185" x2="160" y2="185" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="230" y="175" font-size="12" fill="#475569">否</text>
    <rect x="25" y="160" width="135" height="50" rx="10" fill="#fee2e2" stroke="#dc2626"/>
    <text x="92" y="190" fill="#7f1d1d">显示错误并退出</text>
  </g>
</svg>
